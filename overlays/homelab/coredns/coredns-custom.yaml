apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  lab.server: |-
    lab.${delegating_domain}:53 {
      errors
      cache 30
      forward . 10.1.30.1 10.0.10.1
    }
  nextcloud.override: |-
    rewrite name exact nextcloud.${delegating_domain} traefik.traefik.svc.cluster.local
  # In-cluster pushes/pulls must bypass the CF tunnel (~100MB body cap kills
  # image layer pushes); LAN clients get the same via the MikroTik DNS static.
  harbor.override: |-
    rewrite name exact harbor.${delegating_domain} traefik.traefik.svc.cluster.local
  git.override: |-
    rewrite name exact git.${delegating_domain} traefik.traefik.svc.cluster.local
