apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  # Git sources
  flux_cluster_branch: main
  flux_cluster_repo_url: ssh://git@github.com/lukasfriedhoff/flux-cluster.git
  flux_cluster_repo_secret_name: github-deploy-flux-cluster-prod
  flux_apps_branch: main
  flux_apps_repo_url: ssh://git@github.com/lukasfriedhoff/flux-apps.git
  flux_apps_repo_secret_name: github-deploy-flux-apps-prod
  logday_branch: main
  logday_repo_url: ssh://git@github.com/lukasfriedhoff/logDay.git

  # Longhorn
  longhorn_suspend: "false"
  longhorn_replica_soft_anti_affinity: "true"
  longhorn_storage_minimal_available_percentage: "5"
  longhorn_storage_over_provisioning_percentage: "300"
  longhorn_storage_reserved_percentage_for_default_disk: "10"
  longhorn_ssd_storage_reserved_bytes: "0"
  longhorn_disk_storage_reserved_bytes: "0"
  longhorn_nvme_storage_reserved_bytes: "32212254720"
  longhorn_backup_target: s3://homelab-longhorn-backups@us-east-1/
  longhorn_backup_target_credential_secret_name: longhorn-backup-target

  # Object storage
  s3_force: "true"
  s3_suspend: "false"
  s3_storage_class_name: longhorn-ssd-rwo-1r
  object_storage_endpoint: s3.object-storage.svc.cluster.local:9000

  # Nix cache and builders
  nix_cache_suspend: "false"
  nix_cache_upstream_ip: 10.1.30.25
  attic_suspend: "false"
  attic_public_url: https://attic.h4xx.io/
  attic_api_endpoint: https://attic.h4xx.io/
  authelia_postgres_storage_class_name: longhorn-disk-rwo-1r
  authelia_valkey_storage_class_name: longhorn-disk-rwo-1r
  authelia_postgres_backup_endpoint_url: http://backup.h4xx.io:9000
  authelia_postgres_backup_generation: g20260801/
  authelia_postgres_backup_server_name: authelia-postgres-prod-g20260801
  nix_remote_builder_suspend: "false"
  nix_remote_builder_external_traffic_policy: Cluster
  hydra_replicas: "1"

  # Status dashboard
  status_dashboard_suspend: "false"

  # Nextcloud
  # Keep Nextcloud single-replica while /var/www/html is backed by RWX NFS.
  # Multiple replicas can observe stale app-tree views and serve fatal PHP errors.
  nextcloud_hpa_max_pods: "1"
  nextcloud_resources_limits_memory: "8Gi"
  nextcloud_postgres_backup_endpoint_url: http://backup.h4xx.io:9000
  nextcloud_postgres_backup_generation: g20260616/
  nextcloud_postgres_backup_server_name: nextcloud-postgres-prod-g20260616
  nextcloud_external_photos_enabled: "enabled"
  nextcloud_external_memes_enabled: "enabled"
  nextcloud_postgres_storage_class_name: longhorn-nvme-rwo-2r
  nextcloud_photos_storage_class_name: longhorn-rwx-1r
  # Temporary, for diagnosing half-completed writes from the Android app.
  # Reset to __none__ once the root cause is found.
  nextcloud_debug_user: 08f11a25-d9f3-487d-8a31-0a15df131ca1

  # Shared Nextcloud/Immich folders
  immich_photos_shared_claim_name: immich-photos-nextcloud-shared
  immich_photos_shared_pv_name: immich-photos-nextcloud-shared-pv
  immich_memes_shared_claim_name: immich-memes-nextcloud-shared
  immich_memes_shared_pv_name: immich-memes-nextcloud-shared-pv
  photos_shared_nfs_server: 10.43.98.154
  photos_shared_nfs_path: /pvc-1c196aff-0f34-4bdc-808a-5c58f6191f64
  memes_shared_nfs_server: 10.43.98.154
  memes_shared_nfs_path: /pvc-1c196aff-0f34-4bdc-808a-5c58f6191f64

  # Immich
  immich_suspend: "false"
  immich_oidc: authelia
  immich_ml_cache_storage_class_name: longhorn-ssd-rwo-1r
  immich_uploads_storage_class_name: longhorn-ssd-rwo-1r
  immich_postgres_storage_class_name: longhorn-nvme-rwo-2r
  immich_redis_storage_class_name: longhorn-nvme-rwo-2r
  immich_photos_shared_storage_class_name: longhorn-ssd-rwx-2r
  immich_photos_ml_cache_storage_class_name: longhorn-ssd-rwo-1r
  immich_photos_uploads_storage_class_name: longhorn-ssd-rwo-1r
  immich_photos_postgres_storage_class_name: longhorn-nvme-rwo-2r
  immich_photos_redis_storage_class_name: longhorn-nvme-rwo-2r
  immich_photos_suspend: "false"
  immich_photos_oidc: authelia

  # Matrix
  matrix_postgres_storage_class_name: longhorn-nvme-rwo-2r
  matrix_synapse_postgres_size: 20Gi
  matrix_whatsapp_postgres_size: 5Gi
  matrix_wa_postgres_size: 5Gi
  matrix_telegram_postgres_size: 5Gi
  matrix_signal_postgres_size: 5Gi
  matrix_suspend: "false"
  matrix_server_name: h4xx.io
  matrix_public_hostname: h4xx.io
  matrix_public_baseurl: https://h4xx.io
  matrix_oidc: authelia
  matrix_synapse_data_storage_class_name: longhorn-ssd-rwo-1r
  matrix_synapse_media_storage_class_name: longhorn-ssd-rwo-1r
  matrix_bridge_storage_class_name: longhorn-ssd-rwo-1r

  # Matrix Authentication Service.
  # Staged rollout: MAS runs alongside Synapse in read-only mode first, so
  # nothing about the live legacy login path changes. Flipping to delegated
  # auth requires, in order: preflight dry-run -> cutover job ->
  # matrix_auth_mode: delegated + matrix_mas_synapse_kind: synapse_modern +
  # matrix_mas_compat_host: h4xx.io
  matrix_mas_suspend: "false"
  matrix_mas_replicas: "1"
  matrix_mas_synapse_kind: synapse_read_only
  matrix_mas_preflight_suspend: "true"
  matrix_mas_preflight_generation: prod-20260805-3
  matrix_mas_cutover_suspend: "true"
  matrix_mas_postgres_storage_class_name: longhorn-nvme-rwo-2r
  matrix_mas_postgres_size: 10Gi

  # Forgejo
  forgejo_suspend: "false"
  forgejo_data_storage_class_name: longhorn-ssd-rwo-1r
  forgejo_data_size: 50Gi
  forgejo_postgres_storage_class_name: longhorn-nvme-rwo-2r
  forgejo_postgres_size: 20Gi

  # Media stack
  arr_media_storage_class_name: longhorn-disk-rwx-2r
  arr_media_size: 16T
  jellyfin_gpu_enabled: "true"
  jellyfin_gpu_privileged: "true"
  media_private_trackers_secret_enabled: "true"
  qbittorrent_replicas: "1"
  qbittorrent_vpn_endpoint_cidr: "146.70.237.130/32"
  qbit_manage_cron: "45 */2 * * *"
  qbit_manage_dry_run: "False"
  qbit_manage_suspended: "false"

  # LogDay
  logday_postgres_storage_class_name: longhorn-nvme-rwo-2r
  logday_repo_secret_name: github-deploy-logday-prod
  logday_repo_suspend: "false"
  logday_suspend: "false"

  # Moonlight
  moonlight_suspend: "false"
