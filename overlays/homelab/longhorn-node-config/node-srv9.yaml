apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: srv9
  namespace: longhorn-system
spec:
  # Instance-manager CPU request in millicores; overrides the global
  # guaranteed-instance-manager-cpu (12 % of allocatable = 7680m on this
  # 64-core box, while the IM's 7-day p95 is 2.3 cores; no CPU limit, so it
  # still bursts). Set 2026-11-11 during a reboot: Longhorn only applies a new
  # request when it (re)creates the IM pod, i.e. when the IM has no running
  # instances - never change this on a node with attached volumes and expect
  # it to take effect before the next drain/reboot. Part of clearing
  # KubeCPUOvercommit (requests must fit on srv1+srv8 if srv9 dies).
  instanceManagerCPURequest: 3200
  tags:
    - arr-media-v2
  disks:
    # /var/lib/longhorn lives on the encrypted root partition. Do not schedule
    # replicas here; use only the seven dedicated encrypted data disks below.
    default-disk-db3e3ac3754e9b44:
      path: /var/lib/longhorn/
      allowScheduling: false
      evictionRequested: true
      storageReserved: ${longhorn_nvme_storage_reserved_bytes:=32212254720}
      tags:
        - nvme
    # Seagate ST8000NM0205 ~8TB HDDs.
    longhorn-disk-8tb-a:
      path: /var/lib/longhorn-disk1
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_disk_storage_reserved_bytes:=0}
      tags:
        - disk
    longhorn-disk-8tb-b:
      path: /var/lib/longhorn-disk2
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_disk_storage_reserved_bytes:=0}
      tags:
        - disk
    # Seagate Exos ~18TB HDDs.
    longhorn-disk-18tb-a:
      path: /var/lib/longhorn-disk3
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_disk_storage_reserved_bytes:=0}
      tags:
        - disk
        - arr-media-v2
    longhorn-disk-18tb-b:
      path: /var/lib/longhorn-disk4
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_disk_storage_reserved_bytes:=0}
      tags:
        - disk
        - arr-media-v2
    # ~800GB SAS SSDs. Also tagged `nvme` so the fast DB storage class
    # (longhorn-nvme-rwo-2r, diskSelector=nvme) schedules onto genuine flash
    # here instead of the USB-backed SSDs on srv2/srv8 (measured ~10ms/12MB/s
    # vs 0.19ms/692MB/s here — 2026-09-10).
    longhorn-ssd-800gb-a:
      path: /var/lib/longhorn-disk5
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_ssd_storage_reserved_bytes:=0}
      tags:
        - ssd
        - nvme
    longhorn-ssd-800gb-b:
      path: /var/lib/longhorn-disk6
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_ssd_storage_reserved_bytes:=0}
      tags:
        - ssd
        - nvme
    longhorn-ssd-800gb-c:
      path: /var/lib/longhorn-disk7
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_ssd_storage_reserved_bytes:=0}
      tags:
        - ssd
        - nvme
