apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: srv8
  namespace: longhorn-system
spec:
  disks:
    # /var/lib/longhorn lives on the encrypted root partition. Do not schedule
    # data replicas here; keep it only as a managed disk while existing root
    # replicas are evacuated to dedicated Longhorn disks.
    default-disk-f0a8c6b0b319a94:
      path: /var/lib/longhorn/
      allowScheduling: false
      evictionRequested: true
      storageReserved: ${longhorn_nvme_storage_reserved_bytes:=32212254720}
      tags:
        - nvme
    # T-FORCE 1TB SATA SSD (ata-T-FORCE_1TB_TPBF2209020040602781).
    # Scheduling disabled after Longhorn reported DiskPressure and guest
    # filesystems remounted emergency-readonly from allocation failures.
    # Do not request whole-disk eviction until enough replacement SSD capacity exists.
    longhorn-ssd-1tb:
      path: /var/lib/longhorn-disk1
      allowScheduling: false
      evictionRequested: false
      storageReserved: ${longhorn_ssd_storage_reserved_bytes:=0}
      tags:
        - nvme
        - ssd
    # WD Red 4TB SATA HDD (ata-WDC_WD40EFRX-68N32N0_WD-WCC7K2FFFP9P).
    longhorn-disk-4tb:
      path: /var/lib/longhorn-disk2
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_disk_storage_reserved_bytes:=0}
      tags:
        - disk
    # Seagate BUP Slim 2TB USB HDD (usb-Seagate_BUP_Slim_BK_NA7WEQ6F-0:0).
    # USB transport is the failure surface here — physically it's a normal
    # 2.5" HDD, but bus power / controller / cable adds risk. Tagged `disk`
    # alongside the WD per user direction; treat as best-effort capacity.
    # Disabled after the filesystem remounted emergency-readonly with I/O errors.
    longhorn-disk-2tb-usb:
      path: /var/lib/longhorn-disk3
      allowScheduling: false
      evictionRequested: false
      storageReserved: ${longhorn_disk_storage_reserved_bytes:=0}
      tags:
        - disk
