apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: srv2
  namespace: longhorn-system
spec:
  disks:
    # /var/lib/longhorn lives on the encrypted root partition. Do not schedule
    # data replicas here; keep it only as a managed disk while existing root
    # replicas are evacuated to dedicated Longhorn disks.
    default-disk-ccb62ec5c9533089:
      path: /var/lib/longhorn/
      allowScheduling: false
      evictionRequested: true
      storageReserved: ${longhorn_nvme_storage_reserved_bytes:=32212254720}
      tags:
        - nvme
    # Crucial CT1000BX500 ~1TB USB SSD. DEMOTED out of the nvme/ssd fast tier
    # (2026-09-13): it is USB-attached (~10ms/12MB/s vs srv9 SAS 0.19ms/692MB/s,
    # see longhorn-usb-disk-bottleneck), so the fast storage classes should
    # prefer the genuine flash on srv1 (5x T-FORCE) and srv9 (SAS SSD). Left
    # schedulable + untagged so it still serves the default (untagged) classes
    # as fallback capacity; the 43 existing replicas here are not evicted, they
    # just won't be re-picked for nvme/ssd volumes. Keep the disk ID (live
    # replicas reference it).
    # 2026-09-23: DRAINING srv2 so its USB disks can be physically removed.
    # Every Longhorn data disk on this NUC is USB-attached (lsblk TRAN=usb),
    # so pulling the drives removes all of srv2's storage. Rebuilds finished
    # (0 degraded) and scheduling has been off since 2026-09-22, so eviction
    # now migrates the ~654GiB here onto srv1/srv9. Evict FIRST, pull after
    # the disks report empty - never yank a disk that still holds replicas.
    longhorn-ssd-1tb-a:
      path: /var/lib/longhorn-disk1
      allowScheduling: false
      evictionRequested: true
      storageReserved: ${longhorn_ssd_storage_reserved_bytes:=0}
      tags: []
    # SanDisk SD7SF6S256G1122 ~500GiB USB SSD. This disk currently returns
    # input/output errors on /var/lib/longhorn-disk2 and is not safe for new
    # replicas. Keep the existing Longhorn disk ID so stranded replica records
    # can be cleaned up, but evict and block scheduling until the device is
    # replaced or reformatted.
    longhorn-ssd-1tb-b:
      path: /var/lib/longhorn-disk2
      allowScheduling: false
      evictionRequested: true
      storageReserved: ${longhorn_ssd_storage_reserved_bytes:=0}
      tags:
        - ssd
    # Seagate ST4000VX016 4TiB USB HDD. Draining (NUC retirement).
    # NOTE: this is `disk`-tagged and srv9 is currently the only other node
    # carrying that tag, so its replicas can only land there until srv4 joins.
    longhorn-disk-4tb-usb:
      path: /var/lib/longhorn-disk3
      allowScheduling: false
      evictionRequested: true
      storageReserved: ${longhorn_disk_storage_reserved_bytes:=0}
      tags:
        - disk
