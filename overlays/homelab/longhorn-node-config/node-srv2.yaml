apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: srv2
  namespace: longhorn-system
spec:
  disks:
    # /var/lib/longhorn lives on the BIWIN NVMe root partition. Carve out a
    # slice for nvme-tier replicas, mirroring testing-srv3 and srv8. Keep
    # enough reserved for the OS, k3s and longhorn-manager itself.
    default-disk-ccb62ec5c9533089:
      path: /var/lib/longhorn/
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_nvme_storage_reserved_bytes:=32212254720}
      tags:
        - nvme
    # Crucial CT1000BX500 1TB USB/SATA SSD, mounted through LUKS by srv2.
    # Keep the existing Longhorn disk ID because live replicas reference it.
    longhorn-ssd-1tb-a:
      path: /var/lib/longhorn-disk1
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_ssd_storage_reserved_bytes:=0}
      tags:
        - ssd
    # SanDisk SD7SF6S256G1122 ~500GiB USB SSD. Keep the existing Longhorn
    # disk ID to avoid deleting the old disk record while a stopped replica
    # object still references it.
    longhorn-ssd-1tb-b:
      path: /var/lib/longhorn-disk2
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_ssd_storage_reserved_bytes:=0}
      tags:
        - ssd
    # Seagate ST4000VX016 4TiB USB HDD.
    longhorn-disk-4tb-usb:
      path: /var/lib/longhorn-disk3
      allowScheduling: true
      evictionRequested: false
      storageReserved: ${longhorn_disk_storage_reserved_bytes:=0}
      tags:
        - disk
