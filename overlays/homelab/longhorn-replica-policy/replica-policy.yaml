apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-replica-policy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-replica-policy
rules:
  - apiGroups:
      - longhorn.io
    resources:
      - volumes
    verbs:
      - get
      - list
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-replica-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: longhorn-replica-policy
subjects:
  - kind: ServiceAccount
    name: longhorn-replica-policy
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-replica-policy
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: longhorn-replica-policy
          restartPolicy: Never
          containers:
            - name: reconcile
              image: alpine/k8s:1.34.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - |
                  kubectl -n longhorn-system get volumes.longhorn.io -o json \
                    | jq -r '
                        .items[]
                        | .metadata.name as $volume
                        | (.status.kubernetesStatus.namespace // "") as $namespace
                        | (.status.kubernetesStatus.pvcName // "") as $pvc
                        | (.status.kubernetesStatus.pvStatus // "") as $pv_status
                        | (.status.state // "") as $state
                        | (.status.kubernetesStatus.workloadsStatus // []) as $workloads
                        | ($workloads | map(.workloadType) | unique) as $workload_types
                        | select($namespace != "" and $namespace != "media")
                        | select($pvc != "")
                        | select($pv_status == "Bound")
                        | select($state == "attached")
                        | (if (($workload_types | index("StatefulSet")) or ($workload_types | index("Cluster"))) then 2 else 3 end) as $target
                        | select((.spec.numberOfReplicas | tonumber) != $target)
                        | [$volume, ($target | tostring), $namespace, $pvc, (.spec.numberOfReplicas | tostring), ($workload_types | join(","))]
                        | @tsv
                      ' \
                    | while IFS="$(printf '\t')" read -r volume target namespace pvc current workload_types; do
                        echo "setting ${namespace}/${pvc} (${volume}) from ${current} to ${target} replicas; workloads=${workload_types}"
                        kubectl -n longhorn-system patch volumes.longhorn.io "${volume}" \
                          --type=merge \
                          --patch "{\"spec\":{\"numberOfReplicas\":${target}}}"
                      done
