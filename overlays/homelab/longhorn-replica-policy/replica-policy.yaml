apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-replica-policy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-replica-policy
rules:
  - apiGroups:
      - longhorn.io
    resources:
      - volumes
    verbs:
      - get
      - list
      - patch
  - apiGroups:
      - longhorn.io
    resources:
      - settings
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - persistentvolumes
    verbs:
      - get
      - list
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-replica-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-replica-policy
subjects:
  - kind: ServiceAccount
    name: longhorn-replica-policy
    namespace: longhorn-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-replica-policy
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: longhorn-replica-policy
          restartPolicy: Never
          containers:
            - name: reconcile
              image: alpine/k8s:1.37.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - |
                  rebuild_limit="$(kubectl -n longhorn-system get settings.longhorn.io concurrent-replica-rebuild-per-node-limit -o jsonpath='{.value}')"
                  if [ "${rebuild_limit}" = "0" ]; then
                    echo "replica rebuilds are frozen; skipping replica-policy reconciliation"
                    exit 0
                  fi

                  kubectl get persistentvolumes -o json \
                    | jq -r '
                        .items[]
                        | select((.spec.csi.driver // "") == "driver.longhorn.io")
                        | select((.status.phase // "") == "Bound")
                        | (.spec.csi.volumeHandle // "") as $volume
                        | (.spec.storageClassName // "") as $storage_class
                        | (.spec.claimRef.namespace // "") as $namespace
                        | (.spec.claimRef.name // "") as $pvc
                        | select($volume != "")
                        | select($storage_class != "")
                        | select($namespace != "")
                        | select($pvc != "")
                        | [$volume, $storage_class, $namespace, $pvc]
                        | @tsv
                      ' \
                    | while IFS="$(printf '\t')" read -r volume storage_class namespace pvc; do
                        policy="$(kubectl -n "${namespace}" get persistentvolumeclaim "${pvc}" \
                          -o jsonpath='{.metadata.annotations.longhorn\.h4xx\.io/replica-policy}' 2>/dev/null || true)"
                        if [ "${policy}" = "disabled" ]; then
                          echo "skipping ${namespace}/${pvc} (${volume}); replica policy is disabled"
                          continue
                        fi

                        target="$(kubectl get storageclass "${storage_class}" \
                          -o jsonpath='{.parameters.numberOfReplicas}' 2>/dev/null || true)"
                        override="$(kubectl -n "${namespace}" get persistentvolumeclaim "${pvc}" \
                          -o jsonpath='{.metadata.annotations.longhorn\.h4xx\.io/replica-count}' 2>/dev/null || true)"
                        if [ -n "${override}" ]; then
                          target="${override}"
                        fi

                        case "${target}" in
                          ''|*[!0-9]*|0)
                            echo "skipping ${namespace}/${pvc} (${volume}); ${storage_class} has no valid numberOfReplicas"
                            continue
                            ;;
                        esac

                        current="$(kubectl -n longhorn-system get volumes.longhorn.io "${volume}" \
                          -o jsonpath='{.spec.numberOfReplicas}' 2>/dev/null || true)"
                        if [ -z "${current}" ] || [ "${current}" = "${target}" ]; then
                          continue
                        fi

                        echo "setting ${namespace}/${pvc} (${volume}) from ${current} to ${target} replicas; storageClass=${storage_class}"
                        kubectl -n longhorn-system patch volumes.longhorn.io "${volume}" \
                          --type=merge \
                          --patch "{\"spec\":{\"numberOfReplicas\":${target}}}"
                      done
