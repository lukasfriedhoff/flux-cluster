---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h0m0s
  path: ./overlays/staging-3vm/secrets/
  retryInterval: 10m0s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-cluster
  timeout: 5m0s
  wait: true
  postBuild: null
