apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-replica-policy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-replica-policy
rules:
  - apiGroups:
      - longhorn.io
    resources:
      - volumes
    verbs:
      - get
      - list
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-replica-policy-pv-reader
rules:
  - apiGroups:
      - ""
    resources:
      - persistentvolumes
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-replica-policy-pv-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-replica-policy-pv-reader
subjects:
  - kind: ServiceAccount
    name: longhorn-replica-policy
    namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-replica-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: longhorn-replica-policy
subjects:
  - kind: ServiceAccount
    name: longhorn-replica-policy
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-replica-policy
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: longhorn-replica-policy
          restartPolicy: Never
          containers:
            - name: reconcile
              image: alpine/k8s:1.36.2
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - |
                  kubectl -n longhorn-system get volumes.longhorn.io -o json \
                    | jq -r '
                        .items[]
                        | .metadata.name as $volume
                        | (.status.kubernetesStatus.namespace // "") as $namespace
                        | (.status.kubernetesStatus.pvcName // "") as $pvc
                        | (.status.kubernetesStatus.pvStatus // "") as $pv_status
                        | (.status.kubernetesStatus.pvName // "") as $pv
                        | (.status.kubernetesStatus.workloadsStatus // []) as $workloads
                        | ($workloads | map(.workloadType) | unique) as $workload_types
                        | select($namespace != "")
                        | select($pvc != "")
                        | select($pv != "")
                        | select($pv_status == "Bound")
                        | [$volume, $namespace, $pvc, $pv, (.spec.numberOfReplicas | tostring), ($workload_types | join(","))]
                        | @tsv
                      ' \
                    | while IFS="$(printf '\t')" read -r volume namespace pvc pv current workload_types; do
                        storage_class="$(kubectl get pv "${pv}" -o jsonpath='{.spec.storageClassName}' 2>/dev/null || true)"
                        case "${storage_class}" in
                          *-1r) target=1 ;;
                          *-2r) target=2 ;;
                          *-3r) target=3 ;;
                          *)
                            if [ "${namespace}" = "media" ] || [ "${namespace}" = "nix-cache" ]; then
                              target=1
                            elif printf '%s' "${workload_types}" | grep -Eq '(^|,)(StatefulSet|Cluster)(,|$)'; then
                              target=1
                            else
                              target=2
                            fi
                            ;;
                        esac

                        if [ "${current}" = "${target}" ]; then
                          continue
                        fi

                        echo "setting ${namespace}/${pvc} (${volume}) from ${current} to ${target} replicas; storageClass=${storage_class}; workloads=${workload_types}"
                        kubectl -n longhorn-system patch volumes.longhorn.io "${volume}" \
                          --type=merge \
                          --patch "{\"spec\":{\"numberOfReplicas\":${target}}}"
                      done
