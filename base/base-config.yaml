apiVersion: v1
kind: ConfigMap
metadata:
  name: base-config
  namespace: flux-system
data:
  # Environment config
  cluster_environment: "homelab"
  cluster_name: "homelab"

  # Domain config
  kubernetes_cluster_domain: "k8s.lab.h4xx.io"
  delegating_domain: "h4xx.io"
  public_host_suffix: ""

  # Cloudflare Tunnel
  cloudflare_tunnel_id: "03ed4283-aa2e-4781-8236-fd69a38e130a"
  cloudflare_tunnel_hostname: "03ed4283-aa2e-4781-8236-fd69a38e130a.cfargotunnel.com"
  cloudflare_tunnel_secret_name: "cloudflare-tunnel-credentials"

  # Flux defaults
  flux_gitrepo_interval: "10m0s"
  flux_kustomization_default_interval: "1h0m0s"
  flux_kustomization_default_retry_interval: "10m0s"
  flux_kustomization_default_timeout: "5m0s"

  # Storage - Ceph CSI classes and pools
  ceph_rbd_storage_class_1r_name: "ssd-rbd-1r"
  ceph_rbd_storage_class_1r_pool: "k8s-ssd-1r"
  ceph_rbd_storage_class_2r_name: "ssd-rbd-2r"
  ceph_rbd_storage_class_2r_pool: "k8s-ssd-2r"
  ceph_rbd_storage_class_3r_name: "ssd-rbd-3r"
  ceph_rbd_storage_class_3r_pool: "k8s-ssd-3r"
  ceph_rbd_storage_class_3r_is_default: "true"

  ceph_cephfs_fs_name: "ssd-cephfs"
  ceph_cephfs_storage_class_1r_name: "ssd-cephfs-1r"
  ceph_cephfs_storage_class_1r_pool: "ssd-cephfs-1r"
  ceph_cephfs_storage_class_2r_name: "ssd-cephfs-2r"
  ceph_cephfs_storage_class_2r_pool: "ssd-cephfs-2r"
  ceph_cephfs_storage_class_3r_name: "ssd-cephfs-3r"
  ceph_cephfs_storage_class_3r_pool: "ssd-cephfs-3r"

  # Storage classes consumed by workloads
  default_storage_class_name: "ssd-rbd-3r"
  default_sts_storage_class_name: "ssd-rbd-2r"

  # Cert-manager - Let's Encrypt
  default_cluster_issuer: "letsencrypt-prod"
  cert_issuer_type: "letsencrypt"

  # Ceph CSI config
  ceph_cluster_id: "83897024-e964-11f0-9d5c-0cc47a6c3802"
  ceph_mon_hosts: "v2:10.1.30.12:3300/0"
  ceph_csi_namespace: "ceph-csi"
  ceph_csi_provisioner_host_network: "true"

  # Let's Encrypt config
  letsencrypt_email: "letsencrypt@h4xx.io"
  letsencrypt_server: "https://acme-v02.api.letsencrypt.org/directory"
  letsencrypt_staging_server: "https://acme-staging-v02.api.letsencrypt.org/directory"

  # External DNS
  external_dns_txt_owner_id: "srv1-k3s"

  # Namespace mapping
  cert_manager_namespace: "cert-manager"

  # Authelia
  authelia_smtp_address: "submission://posteo.de:587"
  authelia_smtp_startup_check_address: "h4xx@posteo.de"
  authelia_access_policy: "two_factor"
  authelia_oidc_policy: "two_factor"

  # Nextcloud
  trusted_proxies_cidr: "10.42.0.0/16"
  nextcloud_app_storage_class_name: "ssd-cephfs-2r"
  nextcloud_app_size: "20Gi"
  nextcloud_data_storage_class_name: "ssd-cephfs-2r"
  nextcloud_data_size: "500Gi"
  nextcloud_hpa_min_pods: "1"
  nextcloud_hpa_max_pods: "3"
  nextcloud_hpa_cpu_threshold: "60"
  nextcloud_resources_requests_cpu: "200m"
  nextcloud_resources_requests_memory: "512Mi"
  nextcloud_resources_limits_memory: "2Gi"

  # Valkey
  valkey_auth_secret_name: "nextcloud-valkey"
  valkey_replica_count: "2"
  valkey_min_replicas_to_write: "1"
  valkey_persistence_size: "8Gi"
  valkey_storage_class_name: "ssd-cephfs-2r"

  # Media stack
  media_timezone: "Europe/Berlin"
  media_puid: "1000"
  media_pgid: "1000"
  arr_config_storage_class_name: "ssd-cephfs-1r"
  arr_config_size: "5Gi"
  arr_media_storage_class_name: "ssd-cephfs-1r"
  arr_media_size: "1Ti"
  arr_downloads_storage_class_name: "ssd-cephfs-1r"
  arr_downloads_size: "200Gi"
  protonvpn_server_countries: "Switzerland"
  k8s_pod_cidr: "10.42.0.0/16"
  k8s_service_cidr: "10.43.0.0/16"

  # Monitoring (LGTM)
  k8s_monitoring_namespace: "monitoring"
  k8s_monitoring_chart_version: "3.4.0"
  monitoring_tenant_id: "anonymous"
  monitoring_storage_class_name: "ssd-rbd-2r"
  grafana_persistence_size: "5Gi"
  ceph_mgr_prometheus_endpoint: "srv1.lab.h4xx.io:9283"
  monitoring_s3_region: "us-east-1"
  monitoring_s3_endpoint: "srv1.lab.h4xx.io:7480"
  monitoring_s3_insecure: "true"
  monitoring_s3_force_path_style: "true"
  monitoring_loki_bucket: "homelab-loki"
  monitoring_mimir_blocks_bucket: "homelab-mimir-blocks"
  monitoring_mimir_alertmanager_bucket: "homelab-mimir-alertmanager"
  monitoring_mimir_ruler_bucket: "homelab-mimir-ruler"
  monitoring_tempo_bucket: "homelab-tempo"
  mimir_replication_factor: "3"
  loki_replication_factor: "1"
  loki_read_replicas: "1"
  loki_write_replicas: "1"
  loki_backend_replicas: "1"
  mimir_ingester_replicas: "3"
  mimir_ingester_zone_aware_replication: "true"
  mimir_store_gateway_replicas: "1"
  mimir_store_gateway_zone_aware_replication: "true"
  mimir_querier_replicas: "2"
  mimir_query_scheduler_replicas: "2"
  tempo_replication_factor: "3"
  tempo_ingester_replicas: "3"
