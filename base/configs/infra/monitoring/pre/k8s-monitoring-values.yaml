apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-monitoring-values
  namespace: monitoring
data:
  values.yaml: |-
    cluster:
      name: ${cluster_name}
    global:
      scrapeInterval: 30s
      scrapeTimeout: 10s
    destinations:
      - name: mimir
        type: prometheus
        url: http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push
      - name: loki
        type: loki
        url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
      - name: tempo
        type: otlp
        url: tempo-distributor.monitoring.svc.cluster.local:4317
        protocol: grpc
        tls:
          insecure: true
        metrics:
          enabled: false
        logs:
          enabled: false
        traces:
          enabled: true
    clusterMetrics:
      enabled: true
    clusterEvents:
      enabled: true
    podLogs:
      enabled: true
    annotationAutodiscovery:
      enabled: true
    applicationObservability:
      enabled: true
      receivers:
        otlp:
          grpc:
            enabled: true
          http:
            enabled: true
    node-exporter:
      metricsTuning:
        includeMetrics:
          - node_uname_info
    alloy-metrics:
      enabled: true
      includeDestinations:
        - mimir
      extraConfig: |-
        discovery.kubernetes "monitoring_pods" {
          role = "pod"
        }

        discovery.relabel "monitoring_components" {
          targets = discovery.kubernetes.monitoring_pods.targets

          rule {
            action = "keep"
            source_labels = ["__meta_kubernetes_namespace"]
            regex = "monitoring"
          }

          rule {
            action = "keep"
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            regex = "loki|mimir|tempo"
          }

          rule {
            action = "keep"
            source_labels = ["__meta_kubernetes_pod_container_port_name"]
            regex = "http-metrics"
          }

          rule {
            action = "replace"
            source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_container_port_number"]
            target_label = "__address__"
            regex = "(.+);(\\d+)"
            replacement = "$1:$2"
          }

          rule {
            action = "labelmap"
            regex = "__meta_kubernetes_pod_label_(.+)"
          }

          rule {
            action = "replace"
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_component"]
            target_label = "job"
            regex = "(.+);(.+)"
            replacement = "$1/$2"
          }

          rule {
            action = "replace"
            source_labels = ["job", "__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label = "job"
            regex = ";(.+);(.+)"
            replacement = "$1/$2"
          }

          rule {
            action = "replace"
            source_labels = ["__meta_kubernetes_namespace"]
            target_label = "namespace"
          }

          rule {
            action = "replace"
            target_label = "cluster"
            replacement = "${cluster_name}"
          }

          rule {
            action = "replace"
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label = "pod"
          }
        }

        prometheus.scrape "monitoring_components" {
          targets = discovery.relabel.monitoring_components.output
          forward_to = [prometheus.remote_write.mimir.receiver]
          scrape_interval = "30s"
          scrape_timeout = "10s"
        }

        prometheus.scrape "ceph" {
          targets = [
            {
              "__address__" = "${ceph_mgr_prometheus_endpoint}",
              "cluster" = "${cluster_name}",
            },
          ]
          forward_to = [prometheus.remote_write.mimir.receiver]
          job_name = "ceph"
          scrape_interval = "30s"
          scrape_timeout = "10s"
        }
    alloy-logs:
      enabled: true
    alloy-singleton:
      enabled: true
    alloy-receiver:
      enabled: true
      alloy:
        extraPorts:
          - name: otlp-grpc
            port: 4317
            targetPort: 4317
            protocol: TCP
          - name: otlp-http
            port: 4318
            targetPort: 4318
            protocol: TCP
