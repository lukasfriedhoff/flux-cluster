apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-app
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/traefik
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: 10m0s
  wait: true
