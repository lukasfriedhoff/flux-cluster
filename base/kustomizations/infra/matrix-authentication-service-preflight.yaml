apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-authentication-service-preflight
  namespace: flux-system
spec:
  suspend: ${matrix_mas_preflight_suspend:=true}
  dependsOn:
    - name: matrix-app
    - name: matrix-authentication-service-app
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/matrix-authentication-service/migrations/preflight
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: 30m0s
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: base-config
