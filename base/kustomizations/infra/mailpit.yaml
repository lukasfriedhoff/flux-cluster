apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mailpit-app
  namespace: flux-system
spec:
  suspend: ${mailpit_suspend:=true}
  dependsOn:
    - name: namespaces
    - name: secrets
    - name: cert-manager-app
    - name: traefik-app
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/mailpit
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: 15m0s
  wait: true
  postBuild:
    substitute:
      quote: '"'
    substituteFrom:
      - kind: ConfigMap
        name: base-config
