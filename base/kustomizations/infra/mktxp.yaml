# MikroTik RouterOS exporter (akpw/mktxp) scraping the three site routers over
# the RouterOS API. Credentials come from the SOPS secret mktxp-credentials in
# the monitoring namespace (overlays/<cluster>/secrets), hence dependsOn secrets.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mktxp-app
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: secrets
  interval: 1h0m0s
  path: ./apps/mktxp
  prune: true
  retryInterval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: ${mktxp_suspend:=true}
  wait: true
  postBuild:
    substitute:
      quote: '"'
    substituteFrom:
      - kind: ConfigMap
        name: base-config
