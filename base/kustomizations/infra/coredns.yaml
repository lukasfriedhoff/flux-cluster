apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns-config
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./overlays/homelab/coredns
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-cluster
  timeout: ${flux_kustomization_default_timeout:=5m0s}
  wait: true
