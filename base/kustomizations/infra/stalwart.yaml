apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stalwart-app
  namespace: flux-system
spec:
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  timeout: ${flux_kustomization_default_timeout:=5m0s}
  suspend: ${stalwart_suspend:=true}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  path: ./apps/stalwart
  prune: true
  wait: true
  dependsOn:
    - name: namespaces
    - name: secrets
    - name: cnpg-app
    # Garage, not s3-app. MinIO was decommissioned on 2026-10-23 and its
    # Kustomization suspended - and a SUSPENDED Kustomization never advances its
    # lastAppliedRevision, so every dependent waits forever on
    # "dependency 'flux-system/s3-app' revision is not up to date". stalwart-app
    # had been stuck on exactly that, which also kept the parent `kustomizations`
    # Kustomization permanently not-Ready.
    #
    # NOTE: this unblocks reconciliation only. stalwart's own S3 usage - the CNPG
    # barman archive in postgres.yaml and the bucket bootstrap in
    # s3-bootstrap.yaml - still points at the MinIO service, which is still
    # running despite being suspended. Those need a Garage bucket, a Garage
    # access key and fresh SOPS credentials before MinIO can actually be removed.
    - name: garage-app
    - name: reflector-app
    - name: cert-manager-app
    - name: traefik-app
  postBuild:
    substitute:
      quote: '"'
    substituteFrom:
      - kind: ConfigMap
        name: base-config
