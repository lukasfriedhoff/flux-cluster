apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-app
  namespace: flux-system
spec:
  suspend: ${metallb_suspend:=true}
  dependsOn:
    - name: namespaces
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/metallb
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: ${flux_kustomization_default_timeout:=10m0s}
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: base-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  suspend: ${metallb_suspend:=true}
  dependsOn:
    - name: metallb-app
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/metallb/config
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: ${flux_kustomization_default_timeout:=10m0s}
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: base-config
