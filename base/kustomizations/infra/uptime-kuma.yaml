apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma-app
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: longhorn-app
    - name: traefik-app
  interval: 1h0m0s
  path: ./apps/uptime-kuma
  prune: true
  retryInterval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: ${uptime_kuma_suspend:=true}
  wait: true
  postBuild:
    substitute:
      quote: '"'
    substituteFrom:
      - kind: ConfigMap
        name: base-config
