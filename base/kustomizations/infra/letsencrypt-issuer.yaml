---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: letsencrypt-issuer-app
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-app
    - name: secrets
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/issuer-letsencrypt
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: ${flux_kustomization_default_timeout:=5m0s}
  wait: true
