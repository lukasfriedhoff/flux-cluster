apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: icarus-app
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: secrets
    - name: longhorn-app
    - name: traefik-app
    - name: authelia-app
  interval: 1h0m0s
  path: ./apps/icarus
  prune: true
  retryInterval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: ${icarus_suspend:=true}
  wait: true
  postBuild:
    substitute:
      quote: '"'
    substituteFrom:
      - kind: ConfigMap
        name: base-config
