apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gameserver-exporter-app
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 1h0m0s
  path: ./apps/gameserver-exporter
  prune: true
  retryInterval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: ${gameserver_exporter_suspend:=true}
  wait: true
  postBuild:
    substitute:
      quote: '"'
    substituteFrom:
      - kind: ConfigMap
        name: base-config
