apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-recurringjobs-app
  namespace: flux-system
spec:
  suspend: ${longhorn_suspend:=true}
  dependsOn:
    - name: longhorn-app
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/longhorn-recurringjobs
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: 10m0s
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: base-config
