apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-recurringjobs-app
  namespace: flux-system
spec:
  suspend: ${longhorn_suspend:=true}
  dependsOn:
    - name: longhorn-app
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/longhorn-recurringjobs
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: 10m0s
  wait: true
  postBuild:
    substitute:
      # The literal-quote sentinel for env values whose substitution default
      # is a bare bool or number (kustomize strips plain quoting around a
      # lone substitution). Same as the eight sibling Kustomizations that
      # already define it; its absence here is why ${quote} silently emptied
      # and the 2026-10-02 watchdog/music-env fixes appeared not to work.
      quote: '"'
    substituteFrom:
      - kind: ConfigMap
        name: base-config
