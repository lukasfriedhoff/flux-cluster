apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: obsidian-livesync-app
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: secrets
    - name: longhorn-app
    - name: traefik-app
  interval: 1h0m0s
  path: ./apps/obsidian-livesync
  prune: true
  retryInterval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-apps
  suspend: ${obsidian_livesync_suspend:=true}
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: base-config
