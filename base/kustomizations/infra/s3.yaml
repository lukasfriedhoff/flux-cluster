apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: s3-app
  namespace: flux-system
spec:
  suspend: ${s3_suspend:=true}
  dependsOn:
    - name: namespaces
    - name: secrets
    - name: longhorn-app
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/s3
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: 10m0s
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: base-config
