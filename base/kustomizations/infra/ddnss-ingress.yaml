apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ddnss-ingress-app
  namespace: flux-system
spec:
  suspend: ${ddnss_ingress_suspend:=true}
  dependsOn:
    - name: namespaces
    - name: secrets
    - name: traefik-app
  interval: ${flux_kustomization_default_interval:=1h0m0s}
  path: ./apps/ddnss-ingress
  prune: true
  retryInterval: ${flux_kustomization_default_retry_interval:=10m0s}
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: ${flux_kustomization_default_timeout:=10m0s}
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: base-config
