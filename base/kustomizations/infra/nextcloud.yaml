apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud-app
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: secrets
    - name: cnpg-app
    - name: valkey-app
    - name: cert-manager-app
    - name: traefik-app
  interval: 1h0m0s
  path: ./apps/nextcloud
  prune: true
  force: true
  retryInterval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-apps
  timeout: 15m0s
  wait: true
  postBuild:
    substitute:
      # The literal-quote sentinel for env values whose substitution default
      # is a bare bool or number (kustomize strips plain quoting around a
      # lone substitution). Same as the eight sibling Kustomizations that
      # already define it; its absence here is why ${quote} silently emptied
      # and the 2026-10-02 watchdog/music-env fixes appeared not to work.
      quote: '"'
    substituteFrom:
      - kind: ConfigMap
        name: base-config
