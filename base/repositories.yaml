---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: repositories
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./base/repositories/
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-cluster
  timeout: 1m0s
  wait: true
  dependsOn:
    - name: secrets
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: base-config
        optional: false
